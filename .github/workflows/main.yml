name: Build diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'OfferRejectHelper-v1.0-diagnostic-source.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q OfferRejectHelper-v1.0-diagnostic-source.zip -d extracted
          test -f extracted/SparkRejectHelper/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run parsing and mileage regression checks
        working-directory: extracted/SparkRejectHelper
        run: |
          mkdir -p /tmp/cheese-checks
          javac -d /tmp/cheese-checks app/src/main/java/com/local/sparkreject/Decision.java app/src/main/java/com/local/sparkreject/StoreRule.java app/src/main/java/com/local/sparkreject/OfferRegion.java checks/*.java
          java -cp /tmp/cheese-checks DecisionCheck
          java -cp /tmp/cheese-checks StoreRuleCheck
          java -cp /tmp/cheese-checks OfferRegionCheck

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set unique build version
        run: |
          CODE=$((100000 + GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          echo "CHEESE_CODE=$CODE" >> "$GITHUB_ENV"
          echo "CHEESE_VERSION=2.2.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Restore required permanent signing key
        env:
          CHEESE_DEBUG_KEYSTORE_BASE64: ${{ secrets.CHEESE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CHEESE_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$CHEESE_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "CHEESE_SIGNING_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
            echo "CHEESE_SIGNING_PASSWORD=android" >> "$GITHUB_ENV"
            SIGNER_SHA=$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | sha256sum | cut -d ' ' -f 1)
            test -n "$SIGNER_SHA"
            echo "CHEESE_SIGNER_SHA256=$SIGNER_SHA" >> "$GITHUB_ENV"
          else
            echo "::error::Set CHEESE_DEBUG_KEYSTORE_BASE64 before building. Refusing to generate a different signing key."
            exit 1
          fi

      - name: Build diagnostic APK
        working-directory: extracted/SparkRejectHelper
        run: gradle :app:assembleDebug -PcheeseVersionCode="$CHEESE_CODE" -PcheeseVersionName="$CHEESE_VERSION" --stacktrace

      - name: Name APK and record signing certificate
        run: |
          mkdir -p output
          cp extracted/SparkRejectHelper/app/build/outputs/apk/debug/app-debug.apk "output/Cheese-$CHEESE_VERSION-build-$CHEESE_CODE.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "output/Cheese-$CHEESE_VERSION-build-$CHEESE_CODE.apk" > output/signing-certificate.txt
          ACTUAL_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' output/signing-certificate.txt)
          if [ "$ACTUAL_SHA" != "$CHEESE_SIGNER_SHA256" ]; then
            echo "::error::APK signature does not match the permanent signing key. Refusing upload."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cheese-${{ env.CHEESE_VERSION }}-build-${{ env.CHEESE_CODE }}
          path: output/
          if-no-files-found: error
