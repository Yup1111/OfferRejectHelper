name: Build diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'OfferRejectHelper-v1.0-diagnostic-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q OfferRejectHelper-v1.0-diagnostic-source.zip -d extracted
          test -f extracted/SparkRejectHelper/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build diagnostic APK
        working-directory: extracted/SparkRejectHelper
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfferRejectHelper-v1.0-diagnostic-apk
          path: extracted/SparkRejectHelper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
