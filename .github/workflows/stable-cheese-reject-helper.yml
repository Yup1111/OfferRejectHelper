name: Build stable Cheese Reject Helper

on:
  workflow_dispatch:
  push:
    branches:
      - stable-cheese-reject-helper
    paths:
      - 'stable/CheeseRejectHelper-stable-source.zip.b64/**'
      - '.github/workflows/stable-cheese-reject-helper.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out stable branch
        uses: actions/checkout@v4

      - name: Reconstruct stable source ZIP
        run: |
          cat stable/CheeseRejectHelper-stable-source.zip.b64/part-* > /tmp/CheeseRejectHelper.b64
          base64 --decode /tmp/CheeseRejectHelper.b64 > CheeseRejectHelper-stable-source.zip
          unzip -t CheeseRejectHelper-stable-source.zip
          rm -rf extracted
          mkdir extracted
          unzip -q CheeseRejectHelper-stable-source.zip -d extracted
          test -f extracted/SparkRejectHelper/settings.gradle
          test -f extracted/SparkRejectHelper/app/src/main/java/com/local/sparkreject/RuleEngine.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run stable rule checks
        working-directory: extracted/SparkRejectHelper
        run: |
          mkdir -p /tmp/stable-checks
          javac -d /tmp/stable-checks             app/src/main/java/com/local/sparkreject/Decision.java             app/src/main/java/com/local/sparkreject/StoreRule.java             app/src/main/java/com/local/sparkreject/OfferRegion.java             app/src/main/java/com/local/sparkreject/RuleEngine.java             checks/*.java
          java -cp /tmp/stable-checks DecisionCheck
          java -cp /tmp/stable-checks StoreRuleCheck
          java -cp /tmp/stable-checks OfferRegionCheck
          java -cp /tmp/stable-checks RuleEngineCheck

      - name: Verify stable app isolation
        working-directory: extracted/SparkRejectHelper
        run: |
          grep -q "applicationId 'com.local.cheeserejecthelper'" app/build.gradle
          grep -q 'Cheese Reject Helper' app/src/main/AndroidManifest.xml
          ! grep -R -E '3726|2273' app/src/main/java || (echo "::error::Hard-coded personal store found" && exit 1)
          test -f app/src/main/res/raw/cheese_background.gif

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set stable build version
        run: |
          CODE=$((901000 + GITHUB_RUN_NUMBER))
          echo "STABLE_CODE=$CODE" >> "$GITHUB_ENV"
          echo "STABLE_VERSION=0.9.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          CHEESE_DEBUG_KEYSTORE_BASE64: ${{ secrets.CHEESE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CHEESE_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::CHEESE_DEBUG_KEYSTORE_BASE64 is required"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$CHEESE_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "CHEESE_SIGNING_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "CHEESE_SIGNING_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Build stable APK
        working-directory: extracted/SparkRejectHelper
        run: gradle :app:assembleDebug -PstableVersionCode="$STABLE_CODE" -PstableVersionName="$STABLE_VERSION" --stacktrace

      - name: Prepare deliverables
        run: |
          mkdir -p output
          cp extracted/SparkRejectHelper/app/build/outputs/apk/debug/app-debug.apk "output/Cheese-Reject-Helper-$STABLE_VERSION.apk"
          cp CheeseRejectHelper-stable-source.zip "output/Cheese-Reject-Helper-$STABLE_VERSION-source.zip"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "output/Cheese-Reject-Helper-$STABLE_VERSION.apk" > output/signing-certificate.txt
          {
            echo "Branch: stable-cheese-reject-helper"
            echo "Commit: $GITHUB_SHA"
            echo "Version: $STABLE_VERSION"
            echo "Package: com.local.cheeserejecthelper"
            echo "Advanced Cheese main branch was not modified by this build."
          } > output/BUILD-INFO.txt

      - name: Upload stable deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Cheese-Reject-Helper-${{ env.STABLE_VERSION }}
          path: output/
          if-no-files-found: error
